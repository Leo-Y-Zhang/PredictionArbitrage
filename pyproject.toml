[project]
name = "predarb"
version = "0.1.0"
description = "Does a prediction-market edge survive execution? Walks the order book, applies venue fees and gas, and measures how tightly the no-arbitrage boundary is enforced."
requires-python = ">=3.11"
license = { text = "LicenseRef-Leo-Y-Zhang-Proprietary" }
# No runtime dependencies. The order-book maths, the fee models and the venue
# clients are standard library only, which is deliberate: a tool whose whole
# claim is "this edge does not survive costs" should not itself need a stack to
# audit.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
predarb = "predarb.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",   # long lines are fine here; the prose in docstrings carries meaning
  "B905",   # zip() without strict=: every zip in this codebase pairs sequences
            # that are the same length by construction, and adding strict=True
            # everywhere would be noise rather than a check
  "E741",   # a single-letter name is occasionally the clearest one in maths code
  "E402",   # a few modules deliberately import after a sys.path or backend setup
]
